<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173F35" />
  <meta name="description" content="Gathered is a private small-group journal for Scripture, prayer, members, and follow-ups." />
  <title>Gathered</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="enhancements.css" />
</head>
<body>
  <div id="app"></div>
  <div class="modal-overlay" id="updateModal" role="dialog" aria-modal="true" aria-labelledby="updateTitle" aria-describedby="updateDescription" hidden>
    <div class="modal-card">
      <div class="update-modal-icon" aria-hidden="true">↻</div>
      <div>
        <div class="eyebrow">Update available</div>
        <h2 id="updateTitle">A new version of Gathered is ready.</h2>
        <p class="subtle" id="updateDescription">Update now to get the latest improvements. Your journal data will stay safely on this device.</p>
      </div>
      <button class="btn primary block" id="installUpdate" type="button">Update App</button>
      <button class="btn ghost block" id="dismissUpdate" type="button">Not now</button>
    </div>
  </div>
  <div class="modal-overlay" id="appModal" role="dialog" aria-modal="true" aria-labelledby="appModalTitle" aria-describedby="appModalDescription" hidden>
    <form class="modal-card" id="appModalForm" novalidate>
      <div class="modal-icon" id="appModalIcon" aria-hidden="true">i</div>
      <h2 id="appModalTitle"></h2>
      <p class="modal-description subtle" id="appModalDescription"></p>
      <div class="modal-field field" id="appModalField" hidden>
        <label for="appModalInput" id="appModalLabel"></label>
        <input class="input" id="appModalInput" autocomplete="off" />
      </div>
      <p class="modal-error" id="appModalError" role="alert" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="appModalCancel" type="button">Cancel</button>
        <button class="btn primary" id="appModalSubmit" type="submit">OK</button>
      </div>
    </form>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="modal-controller.js" defer></script>
  <script src="public-config.js" defer></script>
  <script src="app.js" defer></script>
  <script src="standalone-prayers.js" defer></script>
  <script src="share.js" defer></script>
  <script src="crypto.js" defer></script>
</body>
</html>
